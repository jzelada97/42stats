# Despliegue en la VM.
#  - web:  API + web, siempre encendida:  docker compose -f docker-compose.vm.yml up -d web
#  - sync: sincronización con la API de 42, bajo demanda (la programa el timer de systemd,
#          ver deploy/):  docker compose -f docker-compose.vm.yml run --rm sync
#
# Reglas de la VM (~/infra/caddy/PORTS.md): no se publica ningún puerto en el host; Caddy
# alcanza `web` por su nombre de contenedor en la red externa `proxy`.
# Límites de recursos: la VM comparte 2 núcleos con otros proyectos.
services:
  web:
    build: .
    image: stats42:latest
    container_name: stats42-api       # nombre único en la VM (lo usa Caddy)
    command: ["serve", "--port", "8042"]
    # La web usa SU PROPIA aplicación de 42 (solo login): límite de ritmo propio y, si se filtra su secreto, la
    # clave de la sincronización queda a salvo. Contiene FT_UID/FT_SECRET, FT_SESSION_SECRET, FT_BASE_URL, FT_ADMIN_LOGINS.
    env_file: .env.web
    volumes:
      - stats42_data:/data
    networks:
      proxy:
        aliases: [stats42-api]
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8042/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  sync:
    build: .
    image: stats42:latest
    env_file: .env                    # aplicación de 42 de la sincronización (FT_UID/FT_SECRET)
    volumes:
      - stats42_data:/data
    command: ["sync", "-v"]
    restart: "no"
    cpus: "0.5"
    mem_limit: 512m

  # Copia diaria de las dos bases (la programa deploy/stats42-backup.timer):
  #   docker compose -f docker-compose.vm.yml run --rm backup
  # Las copias van a /var/backups/stats42 en el host (carpeta del usuario 1000, el de la imagen).
  backup:
    build: .
    image: stats42:latest
    volumes:
      - stats42_data:/data
      - /var/backups/stats42:/backups
    command: ["backup", "--dest", "/backups", "--keep", "14"]
    restart: "no"
    cpus: "0.5"
    mem_limit: 256m

volumes:
  stats42_data:

networks:
  proxy:
    external: true
