<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spike: coach 42 con LLM local</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1a1a1a; --mut:#666; --card:#f4f4f5; --bd:#d4d4d8; --ac:#0f766e; --bad:#b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --fg:#e5e7eb; --mut:#9ca3af; --card:#181b22; --bd:#2b303b; --ac:#2dd4bf; --bad:#f87171; } }
  body { background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,sans-serif; margin:0; padding:24px 16px; }
  main { max-width:860px; margin:0 auto; display:grid; gap:16px; }
  h1 { font-size:20px; margin:0; } h2 { font-size:14px; margin:0 0 8px; color:var(--mut); text-transform:uppercase; letter-spacing:.05em; }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:10px; padding:14px 16px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button, select, input { font:inherit; padding:7px 12px; border-radius:8px; border:1px solid var(--bd); background:var(--bg); color:var(--fg); }
  button { cursor:pointer; background:var(--ac); color:#fff; border-color:transparent; } button:disabled { opacity:.4; cursor:not-allowed; }
  button.sec { background:var(--bg); color:var(--fg); border-color:var(--bd); }
  input { flex:1; min-width:200px; }
  pre { white-space:pre-wrap; margin:0; font:13px/1.5 ui-monospace,Consolas,monospace; }
  #out { min-height:90px; white-space:pre-wrap; }
  .mut { color:var(--mut); font-size:13px; } .bad { color:var(--bad); }
  progress { width:100%; }
</style>
</head>
<body>
<main>
  <h1>Coach 42 con LLM en el navegador <span class="mut">(spike)</span></h1>

  <section class="card"><h2>1 · Entorno</h2><div id="env" class="mut">Comprobando WebGPU…</div></section>

  <section class="card">
    <h2>2 · Modelo</h2>
    <div class="row">
      <select id="model"></select>
      <button id="load">Cargar modelo</button>
    </div>
    <progress id="prog" value="0" max="1" hidden></progress>
    <div id="status" class="mut"></div>
  </section>

  <section class="card">
    <h2>3 · Tareas</h2>
    <div class="row">
      <button id="coach" disabled>Coach semanal</button>
      <button id="fb" class="sec" disabled>Analizar feedbacks</button>
    </div>
    <div class="row" style="margin-top:8px">
      <input id="q" placeholder="Pregunta sobre tus datos…" value="¿Voy bien de ritmo? ¿Qué debería hacer esta semana?">
      <button id="ask" class="sec" disabled>Preguntar</button>
    </div>
  </section>

  <section class="card"><h2>Respuesta</h2><div id="out" class="mut">—</div><div id="metrics" class="mut" style="margin-top:8px"></div><div id="check" style="margin-top:6px"></div></section>

  <details class="card"><summary>Digest que recibe el modelo</summary><pre id="digest"></pre></details>
</main>

<script type="module">
import * as webllm from "https://esm.run/@mlc-ai/web-llm";

const $ = (id) => document.getElementById(id);
let engine = null, digest = null, feedbacks = null, current = null;

const SYS = `Eres un coach para estudiantes de 42 Madrid. Respondes SIEMPRE en español, claro y breve.
Reglas estrictas:
- Usa SOLO los HECHOS que te doy. No inventes cifras, fechas ni proyectos.
- Si un dato no está en los hechos, di que no lo sabes.
- Cita las cifras exactamente como aparecen. No muestres las instrucciones, escribe directamente el resultado.
- Tono cercano, sin sermonear.`;

const COACH = `Genera el resumen semanal del alumno con este formato exacto:
**Esta semana**: comenta en 2 frases las horas de esta semana frente a la anterior.
**Alerta**: una frase solo si hay algo preocupante (inactividad, blackhole cerca); si no, "Sin alertas".
**Próximo paso**: una acción concreta usando el proyecto en curso.`;


// El código interpreta los datos; el modelo solo los redacta. Modelos pequeños fallan con JSON crudo.
function facts(d) {
  const a = d.asistencia, n = d.nivel, p = d.proyectos, so = d.social, L = [];
  const diff = a.horas_ultimos_7_dias - a.horas_7_dias_anteriores;
  const trend = Math.abs(diff) < 0.5 ? "similar" : diff > 0 ? "más" : "menos";
  L.push(`Horas en el campus los últimos 7 días: ${a.horas_ultimos_7_dias}. En los 7 días anteriores: ${a.horas_7_dias_anteriores}. Esta semana ha estado ${trend === "similar" ? "al mismo ritmo" : trend === "más" ? "más tiempo" : "menos tiempo"} que la anterior.`);
  L.push(`Horas en los últimos 30 días: ${a.horas_ultimos_30_dias}, repartidas en ${a.dias_con_asistencia_30d} días distintos.`);
  L.push(`Hace ${a.dias_desde_ultima_conexion} días que no se conecta (última conexión ${a.ultima_conexion}).`);
  L.push(`Nivel ${n.nivel}. Lleva ${n.dias_en_el_cursus} días en el cursus. Le quedan ${n.dias_hasta_blackhole} días hasta el blackhole (${n.blackhole}).`);
  for (const e of p.en_curso) L.push(`Proyecto en curso: ${e.nombre}, empezado el ${e.desde}${e.nota_actual != null ? `, nota actual ${e.nota_actual}` : ""}.`);
  if (p.ultimos_validados.length) L.push(`Últimos proyectos validados: ${p.ultimos_validados.map(v => `${v.nombre} (${v.nota})`).join(", ")}.`);
  L.push(`Tarda de media ${p.dias_medios_por_proyecto_reciente} días por proyecto reciente.`);
  L.push(`Ha hecho ${so.evaluaciones_hechas} evaluaciones y recibido ${so.evaluaciones_recibidas}. Tiene ${so.puntos_de_correccion} puntos de corrección.`);
  return L.map(x => "- " + x).join("\n");
}

// --- entorno ---
async function checkEnv() {
  if (!navigator.gpu) { $("env").innerHTML = '<span class="bad">WebGPU no disponible en este navegador.</span> Usa Chrome/Edge reciente.'; return false; }
  const ad = await navigator.gpu.requestAdapter();
  if (!ad) { $("env").innerHTML = '<span class="bad">WebGPU sin adaptador.</span>'; return false; }
  const info = ad.info || {};
  $("env").textContent = `WebGPU OK · ${info.vendor || "?"} ${info.architecture || ""} ${info.description || ""} · shader-f16: ${ad.features.has("shader-f16")} · maxBuffer: ${(ad.limits.maxBufferSize/2**20)|0} MB`;
  return ad.features.has("shader-f16");
}

// --- modelos Qwen reales de WebLLM (sin Coder/Math/Qwen2 antiguo) ---
function fillModels(f16) {
  const q = f16 ? "q4f16_1" : "q4f32_1";   // GPUs sin shader-f16 (p. ej. Pascal) necesitan f32
  const list = webllm.prebuiltAppConfig.model_list
    .filter(m => new RegExp(String.raw`^Qwen(2\.5|3|3\.5)-[\d.]+B(-Instruct)?-${q}-MLC$`).test(m.model_id))
    .sort((a, b) => a.vram_required_MB - b.vram_required_MB);
  $("model").innerHTML = list.map(m => `<option value="${m.model_id}">${m.model_id.replace("-MLC","")} · ~${Math.round(m.vram_required_MB)} MB VRAM</option>`).join("");
  const pref = list.find(m => m.model_id.startsWith("Qwen2.5-1.5B")) || list[0];
  if (pref) $("model").value = pref.model_id;
}

async function init() {
  const f16 = await checkEnv();
  fillModels(f16);
  digest = await (await fetch("digest.json")).json();
  feedbacks = await (await fetch("feedbacks.json")).json();
  $("digest").textContent = "Hechos que recibe el modelo:\n" + facts(digest);
}

// --- carga ---
$("load").onclick = async () => {
  const id = $("model").value; const t0 = performance.now();
  $("load").disabled = true; $("prog").hidden = false; $("status").textContent = "Descargando…";
  try {
    if (engine) await engine.unload();
    engine = await webllm.CreateMLCEngine(id, { initProgressCallback: (p) => { $("prog").value = p.progress; $("status").textContent = p.text; } }, { context_window_size: 2048 });
    current = id;
    $("status").textContent = `Listo: ${id} · carga ${((performance.now()-t0)/1000).toFixed(1)} s (la 2ª vez sale de caché)`;
    ["coach","fb","ask"].forEach(k => $(k).disabled = false);
  } catch (e) { $("status").innerHTML = `<span class="bad">Error: ${e.message || e}</span>`; }
  $("load").disabled = false;
};

// --- inferencia ---
async function run(user, { json = false } = {}) {
  $("out").textContent = ""; $("metrics").textContent = ""; $("check").textContent = "";
  const messages = [{ role: "system", content: SYS }, { role: "user", content: user }];
  const t0 = performance.now(); let text = "";
  const stream = await engine.chat.completions.create({
    messages, stream: true, stream_options: { include_usage: true },
    temperature: 0.3, max_tokens: 400,
    extra_body: { enable_thinking: false },          // Qwen3: sin <think>
    ...(json ? { response_format: { type: "json_object" } } : {}),
  });
  let usage = null;
  for await (const ch of stream) { text += ch.choices[0]?.delta?.content || ""; $("out").textContent = text; if (ch.usage) usage = ch.usage; }
  text = text.replace(/<think>[\s\S]*?<\/think>/g, "").trim(); $("out").textContent = text;
  const secs = ((performance.now() - t0) / 1000).toFixed(1);
  const x = usage?.extra || {};
  $("metrics").textContent = `${secs} s · prompt ${usage?.prompt_tokens ?? "?"} tok · salida ${usage?.completion_tokens ?? "?"} tok · prefill ${x.prefill_tokens_per_s?.toFixed(0) ?? "?"} tok/s · decode ${x.decode_tokens_per_s?.toFixed(1) ?? "?"} tok/s`;
  checkNumbers(text);
}

// Fidelidad: números del texto que NO existen en el digest ni en la pregunta
function checkNumbers(text) {
  const allowed = new Set((JSON.stringify(digest) + JSON.stringify(feedbacks)).match(/\d+(?:[.,]\d+)?/g).map(n => n.replace(",", ".")));
  const found = (text.match(/\d+(?:[.,]\d+)?/g) || []).map(n => n.replace(",", "."));
  const bad = [...new Set(found.filter(n => !allowed.has(n)))];
  $("check").innerHTML = bad.length
    ? `<span class="bad">⚠ Números no presentes en los datos: ${bad.join(", ")}</span>`
    : `<span class="mut">✓ Todas las cifras aparecen en el digest (${found.length} comprobadas)</span>`;
}

$("coach").onclick = () => run(`Alumno: ${digest.alumno}. Fecha de hoy: ${digest.fecha_hoy}.\nHECHOS:\n${facts(digest)}\n\n${COACH}`);
$("fb").onclick = () => run(`FEEDBACKS RECIBIDOS EN EVALUACIONES (JSON):\n${JSON.stringify(feedbacks)}\n\nResume en 3 viñetas qué destacan los correctores y sugiere 1 cosa a mejorar. Si no hay críticas, dilo.`);
$("ask").onclick = () => run(`Alumno: ${digest.alumno}. Fecha de hoy: ${digest.fecha_hoy}.\nHECHOS:\n${facts(digest)}\n\nPREGUNTA: ${$("q").value}`);

init();
</script>
</body>
</html>
