[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stats42"
version = "0.1.0"
description = "Stats del campus 42 Madrid a partir de la API de 42"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "tzdata>=2024.1",
    "itsdangerous>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "bandit>=1.7", "pip-audit>=2.7"]

[project.scripts]
stats42 = "stats42.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stats42 = ["web/*", "web_app/*", "web_app/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
